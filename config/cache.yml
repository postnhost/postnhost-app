default: &default
  store_options: &default_store_options
    max_age: <%= 90.days.to_i %>
    max_size: <%= 1.gigabyte %>
    namespace: <%= Rails.env %>
    expiry_batch_size: 500
    expiry_method: :job
  size_estimate_samples: 1000

development:
  <<: *default
  store_options:
    <<: *default_store_options
    max_age: <%= 7.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

production:
  <<: *default
